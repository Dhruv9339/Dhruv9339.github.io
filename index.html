    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const ref = useRef(null);

      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          ref.current.appendChild(i);
          window.lucide.createIcons({
            root: ref.current,
            nameAttr: 'data-lucide',
            attrs: {
              class: className
            }
          });
        }
      }, [name, className]);

      return <span ref={ref} className="inline-flex items-center justify-center" {...props}></span>;
    };

      const [activeModalItem, setActiveModalItem] = useState(null);

      const [favorites, setFavorites] = useState(['c1', 'p1']);

      const [audioMode, setAudioMode] = useState('lofi');

      const [reserveForm, setReserveForm] = useState({

        guests: '2 Guests',

      });

      const audioCtxRef = useRef(null);
      const rainNoiseNodeRef = useRef(null);
      const lofiTimerRef = useRef(null);

      useEffect(() => {
        return () => stopAudio();
      }, []);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 3200);
      };

      const initAndStartAudio = (mode = 'lofi') => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!audioCtxRef.current) {
            audioCtxRef.current = new AudioCtx();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }

          stopAudio();
          setAudioMode(mode);

          if (mode === 'rain') {
            const bufferSize = audioCtxRef.current.sampleRate * 2;
            const noiseBuffer = audioCtxRef.current.createBuffer(1, bufferSize, audioCtxRef.current.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
              b6 = white * 0.115926;
            }

            const whiteNoise = audioCtxRef.current.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = audioCtxRef.current.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;

            const gainNode = audioCtxRef.current.createGain();
            gainNode.gain.setValueAtTime(0.35, audioCtxRef.current.currentTime);

            whiteNoise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtxRef.current.destination);

            whiteNoise.start();
            rainNoiseNodeRef.current = whiteNoise;
            setIsPlayingAudio(true);
            showToast('🌧️ Gentle cafe courtyard rain playing');
          } else {
            const chords = [
              [261.63, 329.63, 392.00, 493.88],
              [220.00, 261.63, 329.63, 392.00],
              [174.61, 220.00, 261.63, 329.63],
              [196.00, 246.94, 293.66, 392.00]
            ];
            let chordIdx = 0;

            const playWarmChime = () => {
              if (!audioCtxRef.current) return;
              const now = audioCtxRef.current.currentTime;
              const currentChord = chords[chordIdx % chords.length];
              chordIdx++;

              currentChord.forEach((freq, i) => {
                const osc = audioCtxRef.current.createOscillator();
                const gain = audioCtxRef.current.createGain();
                const filter = audioCtxRef.current.createBiquadFilter();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.08);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.04, now + 0.1 + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtxRef.current.destination);

                osc.start(now + i * 0.08);
                osc.stop(now + 4.0);
              });
            };

            playWarmChime();
            lofiTimerRef.current = setInterval(playWarmChime, 4500);
            setIsPlayingAudio(true);
            showToast('☕ Lo-fi acoustic warm chime lounge activated');
          }
        } catch (e) {
          console.warn('Audio context restricted:', e);
          showToast('Audio playback enabled upon first click');
        }
      };

      const stopAudio = () => {
        if (rainNoiseNodeRef.current) {
          try { rainNoiseNodeRef.current.stop(); } catch(e) {}
          rainNoiseNodeRef.current = null;
        }
        if (lofiTimerRef.current) {
          clearInterval(lofiTimerRef.current);
          lofiTimerRef.current = null;
        }
        setIsPlayingAudio(false);
      };

      const toggleAudio = (modeToUse) => {
        if (isPlayingAudio && audioMode === modeToUse) {
          stopAudio();
          showToast('Ambient audio paused');
        } else {
          initAndStartAudio(modeToUse);
        }
      };

      const addToCart = (item, e) => {
        if (e) e.stopPropagation();
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
        showToast(`Added ${item.name} to order preview`);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

              {/* Desktop Nav Links */}
              <nav className="hidden md:flex items-center gap-8 text-sm font-sans tracking-wider text-[#5A4B40]">

                <a href="#visit" className="hover:text-[#9B5C35] transition-colors">Hours & Contact</a>
              </nav>

              {/* Action Hub */}
              <div className="flex items-center gap-3">
                <div className="relative group">
                  <button 
                    onClick={() => toggleAudio(audioMode === 'lofi' ? 'rain' : 'lofi')}

                      isPlayingAudio

                        : 'bg-[#F2ECE3] text-[#55453A] border-[#E5DACD] hover:bg-[#E9DFD2]'
                    }`}
                    title="Toggle cafe atmosphere sounds"
                  >

                        <span className="text-[11px] hidden sm:inline font-medium">Ambient</span>
                      </>

                  </ul>
                </div>

                <div className="md:col-span-4 space-y-3">
                  <p className="text-xs uppercase tracking-widest text-[#D3A06E] font-medium">Sunday Morning Postcards</p>
                  <p className="text-xs text-[#A8988A] leading-relaxed">
                    Receive our monthly coffee bean cupping notes, development milestones, and early pop-up announcements.
                  </p>
                  <form 
                    onSubmit={(e) => {
                      e.preventDefault();
                      showToast('💌 Subscribed to Sunday Morning Postcards');
                      e.target.reset();
                    }}
                    className="flex items-center gap-2 pt-1"
                  >
                    <input 
                      type="email" 
                      required 
                      placeholder="your.email@quietmorning.com" 
                      className="bg-[#352920] border border-[#4E3D30] rounded-full px-4 py-2 text-xs text-white placeholder-[#7C6C5E] focus:outline-none focus:border-[#C48958] flex-1" 
                    />
                    <button 
                      type="submit" 
                      className="bg-[#D3A06E] hover:bg-[#E3AF7D] text-[#241C16] px-4 py-2 rounded-full text-xs font-medium tracking-wide transition-colors"
                    >
                      Join
                    </button>
                  </form>
                </div>
              </div>

              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-[11px] text-[#7C6E61]">
                <p>© {new Date().getFullYear()} L’Aura Café & Roastery. Crafted with warmth & serenity.</p>
                <p className="mt-2 sm:mt-0 font-serif italic">Pour slowly. Breathe deeply.</p>
              </div>
            </div>
          </footer>

          {/* Item Details Modal */}
          {activeModalItem && (
            <div className="fixed inset-0 z-50 bg-[#1F1712]/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div 
                className="bg-[#FFFDFB] rounded-3xl max-w-lg w-full overflow-hidden border border-[#E7DCCE] shadow-2xl relative animate-in fade-in zoom-in-95 duration-200"
                onClick={(e) => e.stopPropagation()}
              >
                <button 
                  onClick={() => setActiveModalItem(null)}
                  className="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60 text-white transition-colors"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>

                <div className="relative aspect-[16/10] overflow-hidden">
                  <img 
                    src={activeModalItem.image} 
                    alt={activeModalItem.name} 
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute bottom-3 left-4 bg-[#2D221A]/85 backdrop-blur-md text-[#FAF6F0] text-xs font-sans px-3 py-1 rounded-full">
                    {activeModalItem.tag}
                  </div>
                </div>

                <div className="p-6 md:p-8 space-y-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="font-serif text-2xl text-[#2B2119]">{activeModalItem.name}</h3>
                      <span className="text-xs font-sans text-[#916B4E] uppercase tracking-wider">
                        {activeModalItem.prepTime}
                      </span>
                    </div>
                    <span className="text-xl font-sans font-medium text-[#38281C]">
                      ${activeModalItem.price.toFixed(2)}
                    </span>
                  </div>

                  <p className="text-xs md:text-sm font-sans text-[#6B5A4D] leading-relaxed font-light">
                    {activeModalItem.description}
                  </p>

                  <div>
                    <p className="text-[11px] font-sans uppercase tracking-widest text-[#856C5B] font-semibold mb-2">
                      Flavor Profile & Scent Notes:
                    </p>
                    <div className="flex flex-wrap gap-2">
                      {activeModalItem.notes.map((note, i) => (
                        <span key={i} className="text-xs font-sans bg-[#F5EFE5] text-[#554233] px-3 py-1 rounded-full border border-[#E5DACB]">
                          {note}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 border-t border-[#F2ECE3] flex items-center gap-2">
                    <span className="text-[11px] font-sans text-[#7D6B5C]">Details:</span>
                    {activeModalItem.dietary.map((d, i) => (
                      <span key={i} className="text-[11px] font-sans text-[#52774C] bg-[#EDF4EB] px-2 py-0.5 rounded font-medium">
                        {d}
                      </span>
                    ))}
                  </div>

                  <div className="pt-4 flex gap-3">
                    <button
                      onClick={() => {
                        addToCart(activeModalItem);
                        setActiveModalItem(null);
                      }}
                      className="flex-1 bg-[#2F231B] hover:bg-[#433427] text-[#FAF6F0] py-3 rounded-full font-sans text-xs font-medium tracking-wide transition-all shadow flex items-center justify-center gap-2"
                    >
                      <Icon name="shopping-bag" className="w-4 h-4" />
                      <span>Add to Tray Preview (${activeModalItem.price.toFixed(2)})</span>
                    </button>

                    <button
                      onClick={() => toggleFavorite(activeModalItem.id)}
                      className={`p-3 rounded-full border transition-all ${
                        favorites.includes(activeModalItem.id)
                          ? 'border-[#C26B39] text-[#C26B39] bg-[#FDF5F0]'
                          : 'border-[#DFCFC0] text-[#695444] hover:bg-[#F7F2EA]'
                      }`}
                      aria-label="Wishlist"
                    >
                      <Icon name="heart" className={`w-4 h-4 ${favorites.includes(activeModalItem.id) ? 'fill-current text-[#C26B39]' : ''}`} />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Early Access / Waitlist Modal */}
          {isReserveOpen && (
            <div className="fixed inset-0 z-50 bg-[#1B140F]/65 backdrop-blur-sm flex items-center justify-center p-4">
              <div 
                className="bg-[#FFFDFB] rounded-3xl max-w-lg w-full p-6 md:p-8 border border-[#EADBCC] shadow-2xl relative animate-in fade-in zoom-in-95 duration-200"
                onClick={(e) => e.stopPropagation()}
              >
                <button 
                  onClick={() => setIsReserveOpen(false)}
                  className="absolute top-5 right-5 p-2 rounded-full hover:bg-[#F2ECE3] text-[#6C594A] transition-colors"
                >
                  <Icon name="x" className="w-4 h-4" />
                </button>

                {reservationSuccess ? (
                  <div className="py-12 text-center space-y-4">
                    <div className="w-14 h-14 bg-[#EEF5EC] text-[#4F7C49] rounded-full flex items-center justify-center mx-auto shadow-inner">
                      <Icon name="check" className="w-7 h-7 stroke-[2.5]" />
                    </div>
                    <h3 className="font-serif text-2xl text-[#2B2119]">You're on the Guest List</h3>
                    <p className="text-xs md:text-sm font-sans text-[#6B5A4D] max-w-xs mx-auto">
                      Thank you, {reserveForm.name}! You will receive exclusive early invitations when we host community pop-up tastings and unveil our storefront.
                    </p>
                    <div className="pt-2 text-[11px] font-sans text-[#8C7A6D]">
                      Questions? Write to us directly at lauracaferoastery@gmail.com
                    </div>
                  </div>
                ) : (
                  <form onSubmit={handleReserveSubmit} className="space-y-4 font-sans">
                    <div className="space-y-1">
                      <span className="text-[10px] uppercase tracking-widest text-[#9A6A47] font-semibold">Community Tasting</span>
                      <h3 className="font-serif text-2xl text-[#2B2119]">Early Access & Tasting Waitlist</h3>
                      <p className="text-xs text-[#715E50] font-light">
                        Leave your details to receive private invitations to test roasts, bakery pop-ups, and our official opening.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                      <div>
                        <label className="text-[11px] font-medium text-[#5E4E41] block mb-1">Your Name</label>
                        <input 
                          type="text"
                          required
                          placeholder="Your Name"
                          value={reserveForm.name}
                          onChange={(e) => setReserveForm({...reserveForm, name: e.target.value})}
                          className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                        />
                      </div>

                      <div>
                        <label className="text-[11px] font-medium text-[#5E4E41] block mb-1">Email Address</label>
                        <input 
                          type="email"
                          required
                          placeholder="name@example.com"
                          value={reserveForm.email}
                          onChange={(e) => setReserveForm({...reserveForm, email: e.target.value})}
                          className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-medium text-[#5E4E41] block mb-1">Preferred Experience</label>
                        <select
                          value={reserveForm.tableType}
                          onChange={(e) => setReserveForm({...reserveForm, tableType: e.target.value})}
                          className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                        >
                          <option>Micro-Batch Coffee Tasting</option>
                          <option>Artisan Bakery Pairing</option>
                          <option>Grand Opening Event Invitation</option>
                          <option>Home Brew Masterclass</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-[11px] font-medium text-[#5E4E41] block mb-1">Contact Hours</label>
                        <select
                          value={reserveForm.time}
                          onChange={(e) => setReserveForm({...reserveForm, time: e.target.value})}
                          className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                        >
                          <option>Morning (7:00 AM – 12:00 PM)</option>
                          <option>Afternoon (12:00 PM – 5:00 PM)</option>
                          <option>Evening (5:00 PM – 10:00 PM)</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-medium text-[#5E4E41] block mb-1">Any Notes or Coffee Preferences (Optional)</label>
                      <textarea 
                        rows={2}
                        placeholder="e.g. Love light roast pour overs; oat milk enthusiast..."
                        value={reserveForm.note}
                        onChange={(e) => setReserveForm({...reserveForm, note: e.target.value})}
                        className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                      />
                    </div>

                    <div className="pt-2">
                      <button
                        type="submit"
                        className="w-full bg-[#2F231A] hover:bg-[#433326] text-[#FAF6F0] py-3 rounded-full text-xs font-medium tracking-wide transition-all shadow"
                      >
                        Join Tasting Waitlist
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-[#1D1611]/60 backdrop-blur-sm flex justify-end">
              <div 
                className="bg-[#FFFDFB] w-full max-w-md h-full shadow-2xl border-l border-[#E6DBD0] flex flex-col justify-between animate-in slide-in-from-right duration-300"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-6 border-b border-[#F0E7DB] flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="shopping-bag" className="w-5 h-5 text-[#A56844]" />
                    <h3 className="font-serif text-xl text-[#2B211A]">Your Curated Tray</h3>
                  </div>
                  <button 
                    onClick={() => setIsCartOpen(false)}
                    className="p-1.5 rounded-full hover:bg-[#F4EDE2] text-[#695444] transition-colors"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 flex-1 overflow-y-auto space-y-4">
                  {cart.length === 0 ? (
                    <div className="py-20 text-center space-y-3 font-sans">
                      <div className="w-12 h-12 rounded-full bg-[#F4EFE6] text-[#8E7969] flex items-center justify-center mx-auto">
                        <Icon name="coffee" className="w-5 h-5" />
                      </div>
                      <p className="font-serif text-lg text-[#32271F]">Your tray is waiting</p>
                      <p className="text-xs text-[#7B6A5C] max-w-xs mx-auto">
                        Add a single-origin pour-over or a freshly warm hearth croissant to explore our menu.
                      </p>
                      <button
                        onClick={() => setIsCartOpen(false)}
                        className="mt-2 text-xs font-medium text-[#A85B32] hover:underline"
                      >
                        Return to menu catalog
                      </button>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div 
                        key={item.id}
                        className="p-3 bg-[#FAF7F2] rounded-2xl border border-[#EDE2D5] flex items-center justify-between gap-3 font-sans"
                      >
                        <img 
                          src={item.image} 
                          alt={item.name} 
                          className="w-14 h-14 rounded-xl object-cover shrink-0"
                        />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-serif text-sm text-[#2C2119] truncate">{item.name}</h4>
                          <p className="text-xs text-[#806B5B]">${item.price.toFixed(2)} each</p>
                        </div>

                        <div className="flex items-center gap-2 bg-[#FFFDFB] border border-[#E3D6C8] rounded-full px-2 py-1">
                          <button 
                            onClick={() => updateCartQty(item.id, -1)}
                            className="text-[#6D5A4C] hover:text-black p-0.5"
                          >
                            <Icon name="minus" className="w-3 h-3" />
                          </button>
                          <span className="text-xs font-semibold w-4 text-center">{item.qty}</span>
                          <button 
                            onClick={() => updateCartQty(item.id, 1)}
                            className="text-[#6D5A4C] hover:text-black p-0.5"
                          >
                            <Icon name="plus" className="w-3 h-3" />
                          </button>
                        </div>

                        <span className="text-xs font-medium text-[#382B21] whitespace-nowrap">
                          ${(item.price * item.qty).toFixed(2)}
                        </span>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 border-t border-[#EFE5D9] bg-[#FAF7F2] space-y-4 font-sans">
                    <div className="space-y-1.5 text-xs text-[#6B5749]">
                      <div className="flex justify-between">
                        <span>Subtotal</span>
                        <span>${cartTotal.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Estimated Tax (5%)</span>
                        <span>${(cartTotal * 0.05).toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-sm font-semibold text-[#292019] pt-2 border-t border-[#E4D7C8]">
                        <span>Total Order Preview</span>
                        <span>${(cartTotal * 1.05).toFixed(2)}</span>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        showToast('☕ Sample order saved! Full checkout active at launch.');
                        setCart([]);
                        setIsCartOpen(false);
                      }}
                      className="w-full bg-[#2E221A] hover:bg-[#433428] text-[#F9F5EE] py-3.5 rounded-full text-xs font-medium tracking-wide transition-all shadow flex items-center justify-center gap-2"
                    >
                      <Icon name="check" className="w-4 h-4" />
                      <span>Save Tasting Tray Preview (${(cartTotal * 1.05).toFixed(2)})</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Floating Mobile Cart Bar */}
          {cartItemCount > 0 && !isCartOpen && (
            <div className="fixed bottom-6 right-6 z-30">
              <button
                onClick={() => setIsCartOpen(true)}
                className="bg-[#2B2018] text-[#FBF7F1] pl-4 pr-5 py-3 rounded-full shadow-2xl border border-[#48372B] flex items-center gap-3 hover:scale-105 active:scale-95 transition-all"
              >
                <div className="relative">
                  <Icon name="shopping-bag" className="w-4 h-4 text-[#DDB083]" />
                  <span className="absolute -top-2 -right-2 w-4 h-4 bg-[#B5673E] text-white rounded-full text-[9px] font-sans flex items-center justify-center font-bold">
                    {cartItemCount}
                  </span>
                </div>
                <div className="text-left font-sans">
                  <span className="text-xs font-medium block">View Tray</span>
                </div>
                <span className="text-xs font-mono text-[#DDB083] font-bold border-l border-[#49382C] pl-2">
                  ${(cartTotal * 1.05).toFixed(2)}
                </span>
              </button>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
