  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Playfair Display', serif; }
    .font-sans { font-family: 'Inter', sans-serif !important; }
    .font-serif { font-family: 'Playfair Display', serif !important; }
  </style>
</head>
<body class="bg-[#FBF9F5]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          ref.current.appendChild(i);
          window.lucide.createIcons({
            root: ref.current,
            nameAttr: 'data-lucide',
            attrs: { class: className }
          });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" {...props}></span>;
    };

    const MENU_ITEMS = [
      {
        id: 'c1',
        name: 'Smoked Vanilla Cortado',
        category: 'coffee',
        price: 240,
        tag: "Barista's Pick",
        description: 'Double shot of single-origin espresso balanced with silky steamed oat milk and house-smoked vanilla bean syrup.',
        notes: ['Bourbon Vanilla', 'Dried Fig', 'Dark Cocoa'],
        dietary: ['Vegan Friendly', 'House Specialty'],
        image: 'https://images.unsplash.com/photo-1534778101976-62847782c213?auto=format&fit=crop&w=700&q=80',
        prepTime: '4 mins'
      },
      {
        id: 'c2',
        name: 'Cardamom & Rose Velvet Latte',
        category: 'coffee',
        price: 260,
        tag: 'Signature',
        description: 'Slow-extracted espresso infused with crushed green cardamom pods, steamed milk, and organic Damascus rose water mist.',
        notes: ['Floral Rose Petal', 'Warm Cardamom', 'Sweet Brioche'],
        dietary: ['Vegetarian', 'Oat / Almond Option'],
        image: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=700&q=80',
        prepTime: '5 mins'
      },
      {
        id: 'c3',
        name: 'Kyoto-Style 12hr Cold Drip',
        category: 'coffee',
        price: 280,

        description: 'Slowly brewed drop by drop over twelve hours using ice and washed Geisha beans, served over a hand-carved ice sphere.',
        notes: ['Jasmine Blossom', 'Bergamot', 'Peach Nectar'],
        dietary: ['Gluten Free', 'Zero Added Sugar'],
        image: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=700&q=80',

      {

        price: 290,

        description: 'First harvest Uji ceremonial matcha hand-whisked with bamboo chasen, layered over chilled sweetened oat milk with a hint of yuzu zest.',
        notes: ['Umami Grassiness', 'Subtle Citrus', 'Creamy Finish'],
        dietary: ['Organic', 'Vegan', 'Superfood'],
        image: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=700&q=80',
        prepTime: '4 mins'
      },
      {
        id: 't2',
        name: 'Smoked Lavender Earl Grey',
        category: 'tea',
        price: 220,
        tag: 'Calming',
        description: 'Full leaf bergamot black tea steeped with dried lavender florets and finished with warm whipped vanilla cream.',
        notes: ['French Lavender', 'Calabrian Bergamot', 'Woodsmoke Honey'],
        dietary: ['Contains Caffeine', 'Relaxing'],
        image: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=700&q=80',
        prepTime: '5 mins'
      },
      {
        id: 'p1',
        name: 'Brown Butter Hazelnut Croissant',
        category: 'bakery',
        price: 210,
        tag: 'Fresh Baked',
        description: '72-layer laminated butter dough rolled with roasted Piedmont hazelnut praline and dusted with Maldon sea salt.',
        notes: ['Nutty Crunch', 'Caramelized Flakes', 'Melted Core'],
        dietary: ['Contains Tree Nuts', 'Vegetarian'],
        image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=700&q=80',
        prepTime: 'Baked daily'
      },
      {
        id: 'p2',
        name: 'Pistachio Orange Blossom Brioche',
        category: 'bakery',
        price: 230,
        tag: 'Guest Favorite',
        description: 'Pillowy sourdough brioche bun stuffed with pistachio cream curd and drizzled with candied orange syrup.',
        notes: ['Bright Citrus', 'Crushed Pistachio', 'Tender Crumb'],
        dietary: ['Vegetarian'],
        image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=700&q=80',
        prepTime: 'Baked daily'
      }
    ];

    const GALLERY_MOMENTS = [
      {
        id: 1,
        title: 'Morning Sunbeams & First Pours',
        caption: 'The quiet ritual of manual espresso extraction.',
        rotation: '-rotate-2',
        image: 'https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=600&q=80',
        tag: 'Roastery Lab'
      },
      {
        id: 2,
        title: 'Architectural Courtyard Concept',
        caption: 'Botanical natural light sanctuary planned for our storefront.',
        rotation: 'rotate-3',
        image: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80',
        tag: 'Atmosphere'
      },
      {
        id: 3,
        title: 'Slow Hearth Fermentation',
        caption: 'Stone-milled sourdough loaves and laminated pastries.',
        rotation: '-rotate-1',
        image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80',
        tag: 'Bakery Test Kitchen'
      },
      {
        id: 4,
        title: 'Vinyl & Coffee Grounds',
        caption: 'Lo-fi acoustics paired with fresh microlot beans.',
        rotation: 'rotate-2',
        image: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80',
        tag: 'Tasting Bench'
      }
    ];

    function App() {
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [activeModalItem, setActiveModalItem] = useState(null);
      const [isReserveOpen, setIsReserveOpen] = useState(false);
      const [reservationSuccess, setReservationSuccess] = useState(false);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [favorites, setFavorites] = useState(['c1', 'p1']);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [notification, setNotification] = useState('');

      const [reserveForm, setReserveForm] = useState({
        name: '',
        email: '',
        experience: 'Pop-up Micro Tasting',
        preferredTime: 'Morning (7:00 AM – 12:00 PM)',
        note: ''
      });

      const audioRef = useRef(null);

      useEffect(() => {
        audioRef.current = new Audio('lofi.mp3');
        audioRef.current.loop = true;
        audioRef.current.volume = 0.55;

        return () => {
          if (audioRef.current) {
            audioRef.current.pause();
          }
        };
      }, []);

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(''), 3400);
      };

      const handleAudioToggle = () => {
        if (!audioRef.current) return;
        if (isPlayingAudio) {
          audioRef.current.pause();
          setIsPlayingAudio(false);
          showToast('🔇 Ambient sound turned off');
        } else {
          audioRef.current.play()
            .then(() => {
              setIsPlayingAudio(true);
              showToast('🎵 Playing L’Aura Ambient Lofi');
            })
            .catch((err) => {
              console.warn('Audio play failed:', err);
              showToast('Click anywhere once to permit audio playback');
            });
        }
      };

      const addToCart = (item, e) => {
        if (e) e.stopPropagation();
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...item, qty: 1 }];
        });
        showToast(`Added ${item.name} to order tray`);
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const toggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        setFavorites(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

      const filteredItems = selectedCategory === 'all' 
        ? MENU_ITEMS 
        : MENU_ITEMS.filter(item => item.category === selectedCategory);

      const handleReserveSubmit = (e) => {
        e.preventDefault();
        if (!reserveForm.name || !reserveForm.email) {
          showToast('Please provide your name and email');
          return;
        }
        setReservationSuccess(true);
        setTimeout(() => {
          setReservationSuccess(false);
          setIsReserveOpen(false);
          showToast(`✨ Added ${reserveForm.name} to early tasting waitlist`);
        }, 1800);
      };

      return (
        <div className="min-h-screen bg-[#FBF9F5] text-[#2C241E] font-serif antialiased selection:bg-[#E2D5C3] selection:text-[#2C241E] relative">
          
          {notification && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-[#2D231C]/90 backdrop-blur-md text-[#F4EDE2] px-5 py-2.5 rounded-full text-xs font-sans tracking-wide shadow-xl flex items-center gap-2 border border-[#4A3B30] transition-all animate-bounce">
              <Icon name="sparkles" className="w-3.5 h-3.5 text-[#E6AF75]" />
              <span>{notification}</span>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#FBF9F5]/90 backdrop-blur-md border-b border-[#EDE6DC] transition-all">
            <div className="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
              
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full bg-[#EFE8DE] flex items-center justify-center text-[#6A4E38] shadow-inner border border-[#DECDBB]">
                  <Icon name="coffee" className="w-5 h-5 stroke-[1.75]" />
                </div>
                <div>
                  <span className="text-xl md:text-2xl font-serif tracking-tight font-medium text-[#292019] block leading-none">
                    L’Aura
                  </span>
                  <span className="text-[10px] tracking-[0.25em] font-sans uppercase text-[#887463]">
                    Café & Roastery
                  </span>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-8 text-sm font-sans tracking-wider text-[#5A4B40]">
                <a href="#menu" className="hover:text-[#9B5C35] transition-colors">Menu</a>
                <a href="#philosophy" className="hover:text-[#9B5C35] transition-colors">Philosophy</a>
                <a href="#atmosphere" className="hover:text-[#9B5C35] transition-colors">Atmosphere</a>
                <a href="#visit" className="hover:text-[#9B5C35] transition-colors">Hours & Contact</a>
              </nav>

              <div className="flex items-center gap-2.5">
                
                {/* Navbar Audio Toggle */}
                <div className="flex items-center bg-[#F2ECE3] border border-[#E5DACD] rounded-full p-0.5">
                  <button 
                    onClick={handleAudioToggle}
                    className={`px-3 py-1.5 rounded-full text-xs font-sans transition-all flex items-center gap-1.5 ${
                      isPlayingAudio 
                        ? 'bg-[#3A2B21] text-[#F3ECE2] shadow-sm font-medium' 
                        : 'text-[#55453A] hover:bg-[#E9DFD2]'
                    }`}
                  >
                    {isPlayingAudio ? (
                      <>
                        <Icon name="music" className="w-3.5 h-3.5 text-[#E6AF75] animate-pulse" />
                        <span className="text-[11px] font-sans">L’Aura Lofi</span>
                      </>
                    ) : (
                      <>
                        <Icon name="volume-x" className="w-3.5 h-3.5 opacity-60" />
                        <span className="text-[11px] font-sans">Ambient Audio</span>
                      </>
                    )}
                  </button>

                  {isPlayingAudio && (
                    <button
                      onClick={handleAudioToggle}
                      className="p-1.5 rounded-full hover:bg-[#E0D3C1] text-[#695444] transition-colors ml-0.5"
                      title="Mute audio"
                    >
                      <Icon name="x" className="w-3 h-3" />
                    </button>
                  )}
                </div>

                <button 
                  onClick={() => setIsReserveOpen(true)}
                  className="bg-[#2D231C] hover:bg-[#43352A] text-[#F9F6F0] px-3.5 sm:px-4 py-2 rounded-full text-xs font-sans font-medium tracking-wide transition-all shadow-sm active:scale-95 flex items-center gap-1.5"
                >
                  <Icon name="calendar" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Join Waitlist</span>
                  <span className="sm:hidden">Waitlist</span>
                </button>

                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2.5 rounded-full bg-[#EFE8DE] hover:bg-[#E7DDCF] border border-[#DFCFC0] text-[#3D3027] transition-colors"
                  aria-label="View Order Tray"
                >
                  <Icon name="shopping-bag" className="w-4 h-4" />
                  {cartItemCount > 0 && (
                    <span className="absolute -top-1 -right-1 w-5 h-5 bg-[#A85B32] text-white rounded-full text-[10px] font-sans flex items-center justify-center font-bold shadow">
                      {cartItemCount}
                    </span>
                  )}
                </button>
              </div>

            </div>
          </header>

          {/* Hero Section */}
          <section className="relative pt-12 pb-20 md:pt-20 md:pb-28 overflow-hidden">
            <div className="absolute top-1/4 -left-20 w-96 h-96 bg-[#F4EDE2] rounded-full blur-3xl opacity-70 pointer-events-none" />
            <div className="absolute bottom-10 right-0 w-80 h-80 bg-[#EFE5D6] rounded-full blur-3xl opacity-60 pointer-events-none" />

            <div className="max-w-6xl mx-auto px-6 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

                  <div className="flex flex-wrap items-center gap-2">
                    <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#EFE7DC] border border-[#DFD3C3] text-xs font-sans text-[#705642]">

                    </div>

                    <div className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#E7EFE6] border border-[#CFDFCD] text-xs font-sans text-[#436A3F]">
                      <Icon name="check-circle" className="w-3.5 h-3.5" />
                      <span>Accepting only online orders in Delhi</span>
                    </div>
                  </div>

                  <h1 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-serif text-[#292019] leading-[1.12] font-normal">
                    Slow mornings, <br />
                    <span className="italic font-light text-[#885B3A]">sunlit ceramics,</span> <br />
                    & quiet poured coffee.
                  </h1>

                  <p className="text-[#655345] font-sans text-base sm:text-lg max-w-xl leading-relaxed font-light">
                    An artisan roastery celebrating hand-pulled espresso, cardamom-laced brioche, and unhurried conversation. Currently accepting micro-batch roast orders online across Delhi while preparing our flagship doors.
                  </p>

                  <div className="flex flex-wrap items-center gap-4 pt-2">
                    <a 
                      href="#menu"
                      className="bg-[#30241C] text-[#FAF6F0] px-7 py-3.5 rounded-full font-sans text-sm tracking-wide hover:bg-[#48372C] transition-all shadow-md hover:shadow-lg inline-flex items-center gap-2 group"
                    >
                      <span>Explore Coffee Menu</span>
                      <Icon name="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                    </a>

                    <button 
                      onClick={() => setIsReserveOpen(true)}
                      className="border border-[#BFB09F] hover:border-[#8E6D52] hover:bg-[#F3EFE9] text-[#47372B] px-6 py-3.5 rounded-full font-sans text-sm tracking-wide transition-all"
                    >
                      Early Tasting Waitlist
                    </button>
                  </div>

                  <div className="pt-4 flex flex-wrap items-center gap-6 text-xs font-sans text-[#756455] border-t border-[#EDE4D8]">
                    <div className="flex items-center gap-2">
                      <Icon name="clock" className="w-4 h-4 text-[#A56844]" />
                      <span>Dispatch & Support: <strong>Monday – Sunday: 7:00 AM – 10:00 PM</strong></span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <Icon name="mail" className="w-4 h-4 text-[#A56844]" />
                      <a href="mailto:lauracaferoastery@gmail.com" className="hover:underline">lauracaferoastery@gmail.com</a>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-5 relative flex justify-center">
                  <div className="relative w-full max-w-md">
                    <div className="bg-[#FFFFFF] p-4 pb-8 rounded-2xl shadow-xl border border-[#EDE4D7] transform -rotate-1 hover:rotate-0 transition-transform duration-500">
                      <div className="aspect-[4/5] rounded-xl overflow-hidden relative">
                        <img 
                          src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80" 
                          alt="Warm Cafe Corner" 
                          className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent" />
                        <div className="absolute bottom-3 left-4 text-white font-sans text-xs flex items-center gap-1.5">
                          <Icon name="compass" className="w-3.5 h-3.5 text-[#E7C19D]" />
                          <span>Future Conservatory Concept</span>
                        </div>
                      </div>
                      <div className="mt-4 px-2 flex justify-between items-center">
                        <div>
                          <p className="font-serif italic text-lg text-[#2E241E]">Batch No. 01</p>
                          <p className="text-[11px] font-sans text-[#8C7A6D] uppercase tracking-wider">Delhi Online Roastery</p>
                        </div>
                        <div className="text-right">
                          <span className="text-xs font-sans bg-[#F4EFE6] px-2.5 py-1 rounded-full text-[#6E533F] border border-[#E2D5C4]">
                            Single Origin
                          </span>
                        </div>
                      </div>
                    </div>

                    <div className="absolute -bottom-6 -left-6 bg-[#FAF6F0]/95 backdrop-blur-md p-4 rounded-xl shadow-lg border border-[#E0D3C3] max-w-[210px] hidden sm:block">
                      <div className="flex items-center gap-2 mb-1">
                        <Icon name="star" className="w-4 h-4 fill-[#C88A4A] text-[#C88A4A]" />
                        <span className="text-xs font-sans font-semibold text-[#3A2E24]">94/100 Cupping</span>
                      </div>
                      <p className="text-[11px] font-sans text-[#715E50] leading-snug">
                        Ethically sourced Indian & Ethiopian microlots roasted fresh daily.
                      </p>
                    </div>

                    <div className="absolute -top-4 -right-4 bg-[#2F241C] text-[#F3EDE3] p-3 rounded-2xl shadow-xl flex items-center gap-3 border border-[#48382C]">
                      <div className="w-8 h-8 rounded-full bg-[#463529] flex items-center justify-center">
                        <Icon name="music" className="w-4 h-4 text-[#E2A669]" />
                      </div>
                      <div className="text-left pr-2">
                        <p className="text-[10px] uppercase tracking-wider font-sans text-[#AD9C8E]">L’Aura Atmosphere</p>
                        <p className="text-xs font-serif italic text-[#FDFBF7]">Artisan Lofi Lounge</p>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </section>

          {/* Menu Catalog */}
          <section id="menu" className="py-24 max-w-6xl mx-auto px-6">
            <div className="text-center max-w-2xl mx-auto mb-14 space-y-3">
              <p className="text-xs font-sans uppercase tracking-[0.25em] text-[#936647] font-medium">Curated Provisions</p>
              <h2 className="text-3xl md:text-5xl font-serif text-[#292019] font-normal">Our Artisanal Offerings</h2>
              <p className="text-[#6C5B4E] font-sans text-sm md:text-base leading-relaxed font-light">
                Dialed for exquisite extraction. Available for direct online ordering across Delhi.
              </p>

              <div className="flex flex-wrap justify-center gap-2 pt-6">
                {[
                  { key: 'all', label: 'All Provisions' },
                  { key: 'coffee', label: 'Espresso & Pour Overs' },
                  { key: 'tea', label: 'Ceremonial Teas & Matcha' },
                  { key: 'bakery', label: 'Artisan Bakery' }
                ].map((cat) => (
                  <button
                    key={cat.key}
                    onClick={() => setSelectedCategory(cat.key)}
                    className={`px-4 py-2 rounded-full text-xs font-sans tracking-wide transition-all ${
                      selectedCategory === cat.key
                        ? 'bg-[#2F231B] text-[#FAF6F0] shadow-sm'
                        : 'bg-[#F2EDE4] text-[#635143] hover:bg-[#E7DED2] border border-[#E3D7C9]'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              {filteredItems.map((item) => {
                const isFav = favorites.includes(item.id);
                return (
                  <div 
                    key={item.id}
                    onClick={() => setActiveModalItem(item)}
                    className="group cursor-pointer bg-[#FFFDFB] rounded-2xl overflow-hidden border border-[#ECE2D5] hover:border-[#D0BDA9] transition-all hover:shadow-lg flex flex-col justify-between"
                  >
                    <div>
                      <div className="relative aspect-[16/10] overflow-hidden bg-[#EFEAE2]">
                        <img 
                          src={item.image} 
                          alt={item.name}

                        value={reserveForm.note}
                        onChange={(e) => setReserveForm({...reserveForm, note: e.target.value})}
                        className="w-full bg-[#FAF7F2] border border-[#DDD0C0] rounded-xl px-3 py-2 text-xs text-[#2F231A] focus:outline-none focus:border-[#A85B32]"
                      />
                    </div>

                    <div className="pt-2">
                      <button
                        type="submit"
                        className="w-full bg-[#2F231A] hover:bg-[#433326] text-[#FAF6F0] py-3 rounded-full text-xs font-medium tracking-wide transition-all shadow"
                      >
                        Submit to Waitlist
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-[#1D1611]/60 backdrop-blur-sm flex justify-end">
              <div 
                className="bg-[#FFFDFB] w-full max-w-md h-full shadow-2xl border-l border-[#E6DBD0] flex flex-col justify-between animate-in slide-in-from-right duration-300"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-6 border-b border-[#F0E7DB] flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="shopping-bag" className="w-5 h-5 text-[#A56844]" />
                    <h3 className="font-serif text-xl text-[#2B211A]">Your Curated Tray</h3>
                  </div>
                  <button 
                    onClick={() => setIsCartOpen(false)}
                    className="p-1.5 rounded-full hover:bg-[#F4EDE2] text-[#695444] transition-colors"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 flex-1 overflow-y-auto space-y-4">
                  {cart.length === 0 ? (
                    <div className="py-20 text-center space-y-3 font-sans">
                      <div className="w-12 h-12 rounded-full bg-[#F4EFE6] text-[#8E7969] flex items-center justify-center mx-auto">
                        <Icon name="coffee" className="w-5 h-5" />
                      </div>
                      <p className="font-serif text-lg text-[#32271F]">Your tray is waiting</p>
                      <p className="text-xs text-[#7B6A5C] max-w-xs mx-auto">
                        Add a pour-over or a warm hazelnut croissant to explore your order.
                      </p>
                    </div>
                  ) : (
                    cart.map(item => (
                      <div 
                        key={item.id}
                        className="p-3 bg-[#FAF7F2] rounded-2xl border border-[#EDE2D5] flex items-center justify-between gap-3 font-sans"
                      >
                        <img 
                          src={item.image} 
                          alt={item.name} 
                          className="w-14 h-14 rounded-xl object-cover shrink-0"
                        />
                        <div className="flex-1 min-w-0">
                          <h4 className="font-serif text-sm text-[#2C2119] truncate">{item.name}</h4>
                          <p className="text-xs text-[#806B5B]">₹{item.price} each</p>
                        </div>

                        <div className="flex items-center gap-2 bg-[#FFFDFB] border border-[#E3D6C8] rounded-full px-2 py-1">
                          <button 
                            onClick={() => updateCartQty(item.id, -1)}
                            className="text-[#6D5A4C] hover:text-black p-0.5"
                          >
                            <Icon name="minus" className="w-3 h-3" />
                          </button>
                          <span className="text-xs font-semibold w-4 text-center">{item.qty}</span>
                          <button 
                            onClick={() => updateCartQty(item.id, 1)}
                            className="text-[#6D5A4C] hover:text-black p-0.5"
                          >
                            <Icon name="plus" className="w-3 h-3" />
                          </button>
                        </div>

                        <span className="text-xs font-medium text-[#382B21] whitespace-nowrap">
                          ₹{item.price * item.qty}
                        </span>
                      </div>
                    ))
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-6 border-t border-[#EFE5D9] bg-[#FAF7F2] space-y-4 font-sans">
                    <div className="space-y-1.5 text-xs text-[#6B5749]">
                      <div className="flex justify-between">
                        <span>Items Total</span>
                        <span>₹{cartTotal}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Delivery (Delhi NCR)</span>
                        <span className="text-[#52794D] font-medium">Free</span>
                      </div>
                      <div className="flex justify-between text-sm font-semibold text-[#292019] pt-2 border-t border-[#E4D7C8]">
                        <span>Total</span>
                        <span>₹{cartTotal}</span>
                      </div>
                    </div>

                    <a
                      href={`mailto:lauracaferoastery@gmail.com?subject=New%20Coffee%20Order%20Tray&body=Order%20Summary:%0A${encodeURIComponent(
                        cart.map(i => `${i.name} x ${i.qty} = ₹${i.price * i.qty}`).join('\n')
                      )}%0A%0ATotal:%20₹${cartTotal}`}
                      onClick={() => {
                        showToast('Opening email client for order placement...');
                        setIsCartOpen(false);
                      }}
                      className="w-full bg-[#2E221A] hover:bg-[#433428] text-[#F9F5EE] py-3.5 rounded-full text-xs font-medium tracking-wide transition-all shadow flex items-center justify-center gap-2"
                    >
                      <Icon name="check" className="w-4 h-4" />
                      <span>Email Order to Roastery (₹{cartTotal})</span>
                    </a>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Floating Mobile Cart Bar */}
          {cartItemCount > 0 && !isCartOpen && (
            <div className="fixed bottom-6 right-6 z-30">
              <button
                onClick={() => setIsCartOpen(true)}
                className="bg-[#2B2018] text-[#FBF7F1] pl-4 pr-5 py-3 rounded-full shadow-2xl border border-[#48372B] flex items-center gap-3 hover:scale-105 active:scale-95 transition-all"
              >
                <div className="relative">
                  <Icon name="shopping-bag" className="w-4 h-4 text-[#DDB083]" />
                  <span className="absolute -top-2 -right-2 w-4 h-4 bg-[#B5673E] text-white rounded-full text-[9px] font-sans flex items-center justify-center font-bold">
                    {cartItemCount}
                  </span>
                </div>
                <div className="text-left font-sans">
                  <span className="text-xs font-medium block">View Tray</span>
                </div>
                <span className="text-xs font-mono text-[#DDB083] font-bold border-l border-[#49382C] pl-2">
                  ₹{cartTotal}
                </span>
              </button>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
